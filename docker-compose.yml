services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eventiq_utf8
      POSTGRES_USER: eventiq
      POSTGRES_PASSWORD: eventiq_local_only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - eventiq_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventiq"]
      interval: 5s
      retries: 5
volumes:
  eventiq_data:
